target_url: "https://tsuki.page/wiki/doraemon/2005-present"
output_json: "data/doraemon_episodes.json"
output_csv: "data/doraemon_episodes.csv"

selectors:
  # Adjust these based on actual page inspection
  episode_table: "table.wikitable, table.episode-list, tbody"
  episode_row: "tr"
  episode_number: "td:first-child"
  season_episode: "td:nth-child(2)"
  title: "td:nth-child(3) a, td:nth-child(3)"
  
follow_links: true
delay_between_requests: 1.5
max_pages: 50
